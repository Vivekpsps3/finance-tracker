<nav class="vivek-nav" aria-label="Main">
  <div class="vivek-nav__inner">
    <a class="vivek-nav__logo" [routerLink]="tabs().length ? tabs()[0].path : '/'">{{ logo() }}</a>
    <div class="vivek-nav__tabs">
      @for (tab of tabs(); track tab.path) {
        <a [routerLink]="tab.path" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: tab.path === '/' }">
          {{ tab.label }}
        </a>
      }
    </div>
    <div class="vivek-nav__end">
      @for (link of crossLinks(); track link.href) {
        <a class="vivek-nav__ext" [href]="link.href">{{ link.label }}</a>
      }
      @if (showTheme()) {
        <div class="vivek-nav__theme" role="group" aria-label="Color mode">
          <button type="button" [class.on]="theme() === 'light'" (click)="setTheme('light')">Light</button>
          <button type="button" [class.on]="theme() === 'dark'" (click)="setTheme('dark')">Dark</button>
        </div>
      }
      <ng-content />
    </div>
  </div>
</nav>
