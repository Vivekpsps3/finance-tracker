<ui-card>
  <form class="vivek-login" (ngSubmit)="submit()">
    <h1>{{ title() }}</h1>
    <ui-input label="Username" name="username" autocomplete="username" [(value)]="username" />
    <ui-input
      label="Passphrase"
      type="password"
      name="passphrase"
      autocomplete="current-password"
      [showPasswordToggle]="true"
      [(value)]="passphrase" />
    @if (error()) {
      <p class="vivek-login__error" role="alert">{{ error() }}</p>
    }
    <ui-button type="submit" [disabled]="loading()">Unlock</ui-button>
  </form>
</ui-card>
