# Local-first production-like stack: web serves Angular and proxies /api to FastAPI.
# Usage: docker compose --env-file .env up --build
# Open: http://127.0.0.1:8080
# me-app: docker compose --env-file .env --profile apps up --build

services:
  api:
    build:
      context: ./apps/finance/backend
    volumes:
      - ${FINANCE_DATA_DIR:-./data}:/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/finance.db}
      API_HOST: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      DISABLE_OPENAPI: ${DISABLE_OPENAPI:-1}
      ALEMBIC_STRICT: ${ALEMBIC_STRICT:-1}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./apps/finance/frontend
      additional_contexts:
        packages: ./packages
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  me:
    build:
      context: ./apps/me
      additional_contexts:
        packages: ./packages
    container_name: me-app
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: "8090"
      ORIGIN: ${ME_ORIGIN:-https://me.vivekpanchagnula.com}
      SQLITE_PATH: /data/app.db
      STATIC_DIR: /app/static
      PI_CODING_AGENT_DIR: /data/pi
      PI_SKIP_VERSION_CHECK: "1"
      PI_TELEMETRY: "0"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://127.0.0.1:8999/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local}
      OPENAI_MODEL: ${OPENAI_MODEL:-muse-glimmer-30b-thinking}
      OPENAI_CONTEXT_LENGTH: ${OPENAI_CONTEXT_LENGTH:-131072}
    volumes:
      - ${ME_DATA_DIR:-./data/me}:/data
      - /home/vivek/Deployments/Vault:/data/vault
    restart: unless-stopped
    profiles:
      - apps
